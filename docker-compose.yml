# Local PostgreSQL for development: `docker compose up -d`
services:
  postgres:
    image: postgres:16-alpine
    container_name: graeville-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graeville_pos
    ports:
      - '5432:5432'
    volumes:
      - graeville_pos_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d graeville_pos']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  graeville_pos_data:
